[package]
name = "kernel_bpf"
version = "0.1.0"
edition = "2024"

[dependencies]
spin.workspace = true
zerocopy.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
proptest = "1"

[features]
default = []
cloud-profile = []
embedded-profile = []
# Excluded from every shipped profile until code images have an owned,
# compile-on-load RW-to-RX lifecycle.
experimental-aarch64-jit = []

[[bench]]
name = "interpreter"
harness = false

[[bench]]
name = "verifier"
harness = false

[[bench]]
name = "maps"
harness = false
