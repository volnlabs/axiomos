[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
kernel_abi = { path = "crates/kernel_abi" }
kernel_bpf = { path = "crates/kernel_bpf", default-features = false }
kernel_devfs = { path = "crates/kernel_devfs" }
kernel_device = { path = "crates/kernel_device" }
kernel_elfloader = { path = "crates/kernel_elfloader" }
kernel_memapi = { path = "crates/kernel_memapi" }
kernel_pci = { path = "crates/kernel_pci" }
kernel_physical_memory = { path = "crates/kernel_physical_memory" }
kernel_syscall = { path = "crates/kernel_syscall" }
kernel_time = { path = "crates/kernel_time" }
kernel_usermem = { path = "crates/kernel_usermem" }
kernel_vfs = { path = "crates/kernel_vfs" }
kernel_virtual_memory = { path = "crates/kernel_virtual_memory" }
shrike_link = { path = "crates/shrike_link" }

addr2line.workspace = true
bitfield.workspace = true
bitflags.workspace = true
conquer-once.workspace = true
cordyceps.workspace = true
elf.workspace = true
itertools.workspace = true
jiff.workspace = true
linked_list_allocator.workspace = true
linkme.workspace = true
log.workspace = true
mkfs-ext2.workspace = true
mkfs-filesystem.workspace = true
rustc-demangle.workspace = true
sha3.workspace = true
spin.workspace = true
thiserror.workspace = true
uart_16550.workspace = true
virtio-drivers.workspace = true
volatile.workspace = true
zerocopy.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu.workspace = true
fdt.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv.workspace = true

[build-dependencies]
cc = "1.0"

[target.'cfg(target_arch = "x86_64")'.dependencies]
acpi.workspace = true
raw-cpuid.workspace = true
x2apic.workspace = true
x86_64.workspace = true
limine.workspace = true

[features]
default = []
backtrace = []
x86_64_arch = []
riscv64_arch = []
aarch64_arch = []
rpi5 = ["aarch64_arch"]
virt = ["aarch64_arch"]

# Physical reality profiles for eBPF subsystem
# Use --features cloud-profile or --features embedded-profile
cloud-profile = ["kernel_bpf/cloud-profile"]
embedded-profile = ["kernel_bpf/embedded-profile", "rpi5"]

# Convenience aliases
cloud = ["cloud-profile", "x86_64_arch"]
embedded-rpi5 = ["embedded-profile"]

# Track B: emit a per-load `AXIOM VERIFIER COST` marker (states + cntvct cycles)
# from the BPF load path. Off by default — measurement instrumentation, not for
# production images. Enable alongside a profile to capture the verifier-cost
# curve, e.g. `--features embedded-rpi5,verifier-cost`.
verifier-cost = []

# Compatibility marker for callers that previously selected signed mode. Signed
# loading is now the fail-closed default.
bpf-production-signed = []
# Explicit escape hatch for local demo images that load unsigned BPF objects.
# Production artifacts must never enable this feature.
bpf-unsigned-development = []

# One-shot serial markers consumed by the local audit gate. Production images
# do not enable this feature and compile all `log` macros out in release mode.
audit-diagnostics = []

# Raw AArch64 register/UART probes used only during hardware bring-up.
bringup-diagnostics = []

# v0.3 HW bench (Task 11): on-chip latency instrumentation (M-A/M-B/M-C),
# the physical e-stop button IRQ path, and an auto-loaded GPIO->stop reflex.
# Off by default — measurement/demo instrumentation, not for production images.
# Enable alongside a profile, e.g. `--features embedded-rpi5,bench`.
bench = []
