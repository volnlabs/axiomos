[markers]
PI5_MC = "per sensor edge: ns=<edge->actuate cycles in ns> (M-C, IRQ-entry to actuation apply). One per pulse."
PI5_MA = "per guarded actuation: ns=<monitor decide overhead> (M-A / V03-A)."
note = "M-C is the software path (IRQ entry -> apply); the physical pad-to-pad edge (9.25us single sample) is separate and larger. Reflex fires per edge regardless of output state, so no re-arm needed for the M-C distribution."
