baseline_sites = 676
baseline_fingerprint = "sha256:962df3d2e602dec3878c2cc79afd4bcbb4a54541abf7a1732facfd7389d52533"

# Rules are evaluated in order. Keep narrow, high-risk obligations before broad
# subsystem rules. The first matching rule supplies every site-level field.

[[obligation]]
id = "TEST-HARNESS"
paths = ["*/tests/*", "*/benches/*", "*/fuzz/fuzz_targets/*"]
scope = "test/tooling"
owner = "owning crate maintainers"
invariant = "Synthetic pointers, ABI shims, and reset hooks remain confined to process-isolated test or fuzz binaries."
callers = "cargo test, cargo bench, cargo fuzz"
tests = "The containing harness is the evidence; production linkage must remain impossible."
priority = "P3"
reviewed = "2026-07-12"

[[obligation]]
id = "MEM-ADDRESS-SPACE"
paths = ["kernel/src/mem/address_space/*"]
scope = "production"
owner = "memory/MMU maintainers"
invariant = "Page-table pointers are uniquely mapped and live under the address-space lock; user copies validate every page with permissions held stable."
callers = "process creation, exec, mmap/munmap, CurrentUserMemory"
tests = "kernel_usermem tests; x86/AArch64 kernel checks; QEMU user-copy and boot smoke. Concurrency fault injection remains missing."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "MEM-PHYSICAL"
paths = ["kernel/src/mem/phys.rs", "kernel/crates/kernel_physical_memory/*"]
scope = "production"
owner = "physical-memory maintainers"
invariant = "Frame allocator globals are initialized once, serialized, and never hand out aliased or reserved frames."
callers = "heap setup, page-table mapper, DMA allocation, AddressSpace"
tests = "kernel_physical_memory unit tests and boot smoke; SMP allocator stress and reserved-range fault injection are missing."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "MEM-VIRTUAL"
paths = ["kernel/src/mem/virt.rs", "kernel/crates/kernel_virtual_memory/*"]
scope = "production"
owner = "virtual-memory maintainers"
invariant = "Released virtual segments were allocated by the same allocator, remain unmapped, and cannot be released twice or overlap live reservations."
callers = "address spaces, heap, MMIO and JIT mappings"
tests = "kernel_virtual_memory unit tests; transactional map/unmap and double-release integration tests remain missing."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "MEM-KERNEL-RAW"
paths = ["kernel/src/mem/*", "kernel/crates/kernel_memapi/*", "kernel/crates/kernel_map_transaction/*"]
scope = "production"
owner = "kernel memory maintainers"
invariant = "Raw allocation and slice construction use live mapped allocations with exclusive access for mutable views and exact layout provenance."
callers = "global allocator, kernel collections, mapper bookkeeping"
tests = "Host crate tests and boot smoke; Miri coverage for host-capable allocation primitives remains missing."
priority = "P1"
reviewed = "2026-07-12"

[[obligation]]
id = "SYSCALL-BOUNDARY"
paths = ["kernel/src/syscall/*"]
scope = "production"
owner = "syscall/security maintainers"
invariant = "Syscall register values are treated as untrusted integers; memory access crosses only the bounded user-memory adapter while the mapping guard is held."
callers = "architecture syscall entry and dispatch"
tests = "kernel_usermem/kernel_syscall tests and QEMU invalid-pointer smoke; full syscall fault matrix remains missing."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "SYSCALL-PRIMITIVES"
paths = ["kernel/crates/kernel_syscall/*", "kernel/crates/kernel_usermem/*"]
scope = "production"
owner = "syscall/security maintainers"
invariant = "UserspacePtr construction proves only numeric range; dereference requires a UserMemory implementation that validates mappings, permissions, bounds, and lifetime."
callers = "kernel syscall adapters and process memory operations"
tests = "kernel_syscall and kernel_usermem unit tests; targeted Miri is required for host-capable pointer helpers."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "SCHEDULER-WAIT-TRANSITION"
paths = ["kernel/src/mcore/mtask/scheduler/wait.rs", "kernel/src/mcore/mtask/scheduler/wait_channel.rs"]
scope = "production"
owner = "scheduler/SMP maintainers"
invariant = "The current task owns a generation-stamped wait registration, the condition lock is released, and local interrupts remain masked across the exclusive scheduler transition."
callers = "child-exit, pipe, and device wait paths"
tests = "wait protocol interleaving model, x86/AArch64 kernel checks, and SMP QEMU lifecycle smoke"
priority = "P0"
reviewed = "2026-07-14"

[[obligation]]
id = "SCHEDULER-TASK"
paths = ["kernel/src/mcore/mtask/*", "kernel/src/mcore/context.rs", "kernel/src/mcore/lapic.rs", "kernel/src/mcore/mod.rs"]
scope = "production"
owner = "scheduler/SMP maintainers"
invariant = "Task and CPU-local state has one mutable owner at a time; context pointers stay pinned and live across switches; interrupt state matches lock assumptions."
callers = "timer interrupt, syscall exit, spawn/exit/wait, scheduler switch"
tests = "QEMU SMP boot and lifecycle smoke; loom/model tests and forced preemption at mutation points remain missing."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "AARCH64-PAGING"
paths = ["kernel/src/arch/aarch64/paging.rs", "kernel/src/arch/aarch64/mm.rs", "kernel/src/arch/aarch64/mem.rs", "kernel/src/arch/aarch64/phys.rs"]
scope = "production"
owner = "AArch64 MMU maintainers"
invariant = "Descriptor writes target aligned, uniquely owned tables; physical-to-virtual translations refer to mapped RAM; TLB maintenance orders publication and reuse."
callers = "AArch64 boot, AddressSpace, heap/MMIO mapping"
tests = "AArch64 compile and QEMU boot smoke; map/unmap fault injection and multicore TLB shootdown tests remain missing."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "AARCH64-PLATFORM-MMIO"
paths = ["kernel/src/arch/aarch64/platform/*"]
scope = "production"
owner = "AArch64 platform/driver maintainers"
invariant = "MMIO addresses match the selected board DT/platform map, register access is volatile and width-correct, and peripheral ownership is serialized."
callers = "Raspberry Pi 5 and virt platform initialization, GPIO/PWM/UART control"
tests = "Platform compile and hardware/QEMU smoke; register-level mocks and concurrent peripheral ownership tests are incomplete."
priority = "P1"
reviewed = "2026-07-12"

[[obligation]]
id = "AARCH64-EXCEPTION-CONTEXT"
paths = ["kernel/src/arch/aarch64/*"]
scope = "production"
owner = "AArch64 architecture maintainers"
invariant = "Assembly context layouts match Rust repr(C) types, exception vectors preserve all required registers, and interrupt-controller state is CPU-local and initialized."
callers = "AArch64 boot, exception vectors, scheduler, syscall entry"
tests = "AArch64 compile and QEMU boot/exception smoke; nested exception and SMP interrupt stress remain missing."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "X86-INTERRUPT-CONTEXT"
paths = ["kernel/src/arch/idt.rs", "kernel/src/arch/gdt.rs", "kernel/src/arch/x86_64.rs", "kernel/src/apic.rs", "kernel/src/hpet.rs", "kernel/src/sse.rs"]
scope = "production"
owner = "x86_64 architecture maintainers"
invariant = "Naked/assembly frames match Rust layouts, privilege transitions use valid stacks/selectors, interrupt state is restored, and MMIO timer/controller mappings stay live."
callers = "x86 boot, IDT/syscall entry, scheduler tick, timekeeping"
tests = "x86 kernel check and QEMU boot/syscall/exception smoke; nested interrupt and malformed-frame tests remain missing."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "RISCV-ARCH"
paths = ["kernel/demos/riscv/*"]
scope = "experimental demo"
owner = "RISC-V architecture maintainers"
invariant = "Trap/context assembly matches Rust layouts, CSR and SBI operations execute at the expected privilege level, and boot pointers are valid for the machine profile."
callers = "RISC-V boot, trap entry, shutdown and demo runtime"
tests = "RISC-V target clippy/check; boot, syscall, and trap integration coverage is incomplete."
priority = "P1"
reviewed = "2026-07-12"

[[obligation]]
id = "BPF-HELPERS"
paths = ["kernel/src/bpf/helpers.rs"]
scope = "production"
owner = "BPF runtime/security maintainers"
invariant = "Helper arguments proven by the verifier still refer to live context, map, and stack regions of the required size and alignment at execution time."
callers = "BPF interpreter and JIT helper dispatch"
tests = "cloud/embedded BPF suites and semantic consistency tests; adversarial helper provenance and concurrent map-lifetime tests remain required."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "BPF-EXECUTION-JIT"
paths = ["kernel/crates/kernel_bpf/src/execution/*", "kernel/src/bpf/jit_memory.rs"]
scope = "production"
owner = "BPF runtime/JIT maintainers"
invariant = "Only VerifiedProgram reaches execution; context lifetime covers execution; generated code obeys ABI, branch, bounds, cache, and W^X requirements."
callers = "BpfExecutor, kernel hook dispatch, AArch64 JIT"
tests = "cloud/embedded execution and verifier suites plus fuzzing; JIT differential tests and enforced RW-to-RX lifecycle remain incomplete."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "BPF-MAPS"
paths = ["kernel/crates/kernel_bpf/src/maps/*", "kernel/crates/kernel_bpf/src/actuation/*"]
scope = "production"
owner = "BPF map/runtime maintainers"
invariant = "Returned map pointers remain aligned, in-bounds, initialized, and live for the full access; Send/Sync premises hold under concurrent update and unload."
callers = "BPF helpers, actuation controller, userspace map syscalls"
tests = "cloud/embedded map suites and property tests; Miri/loom and unload-during-execution tests remain missing."
priority = "P0"
reviewed = "2026-07-12"

[[obligation]]
id = "BPF-KERNEL-INTEGRATION"
paths = ["kernel/src/bpf/*", "kernel/crates/kernel_bpf/src/*", "kernel/crates/kernel_bpf/src/concurrency/*"]
scope = "production"
owner = "BPF runtime/security maintainers"
invariant = "Verifier, profile, attach, scheduler, signing, and kernel registry boundaries preserve program, context, credential, quota, and lifetime invariants."
callers = "bpf syscall, device hooks, scheduler hooks, actuation"
tests = "cloud/embedded complete BPF suites, epoch-snapshot concurrency tests, SMP attach/fire/detach QEMU stress, and kernel checks; model-checked reclamation remains missing."
priority = "P0"
reviewed = "2026-07-13"

[[obligation]]
id = "DMA-MMIO-DRIVERS"
paths = ["kernel/src/driver/*", "kernel/src/acpi.rs", "kernel/src/driver/pci.rs", "kernel/crates/kernel_pci/*", "kernel/crates/kernel_device/*"]
scope = "production"
owner = "device/PCI/VirtIO maintainers"
invariant = "MMIO and DMA pointers are mapped for the device lifetime, buffers satisfy device ownership/alignment rules, and transport access is serialized."
callers = "ACPI/PCI discovery, VirtIO init, block/GPU/raw device I/O"
tests = "QEMU device boot and filesystem smoke; IOMMU/DMA fault injection and hot-unplug tests are missing."
