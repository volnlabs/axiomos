invariant = "The RP1 GPIO register window is mapped for the kernel lifetime and the singleton peripheral is not accessed through competing mutable owners."
callers = "actuation initialization and watchdog-controlled GPIO paths"
tests = "AArch64 target check and Raspberry Pi safety smoke; concurrent ownership and MMIO fault injection remain missing."
