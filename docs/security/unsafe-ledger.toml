owner = "kernel platform maintainers"
invariant = "Bootloader/firmware pointers, linker symbols, allocator setup, assembly reads, and ABI attributes satisfy their documented platform lifetime and layout contracts."
callers = "architecture entrypoints, panic/logging, benchmark and backtrace paths"
tests = "x86/AArch64/RISC-V target checks and boot smoke; malformed boot metadata and backtrace-chain tests are incomplete."
