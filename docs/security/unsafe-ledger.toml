[[obligation]]
id = "KERNEL-BOOT-RUNTIME"
paths = ["kernel/src/main*.rs", "kernel/src/lib.rs", "kernel/src/fatal.rs", "kernel/src/limine.rs", "kernel/src/log.rs", "kernel/src/serial.rs", "kernel/src/backtrace.rs", "kernel/src/time.rs", "kernel/src/bench.rs", "kernel/build.rs"]
