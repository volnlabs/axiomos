paths = ["kernel/src/file/*", "kernel/crates/kernel_vfs/*", "kernel/crates/kernel_devfs/*"]
scope = "production"
owner = "VFS/filesystem maintainers"
invariant = "Interior raw references do not outlive nodes or aliases, and foreign filesystem callbacks receive valid buffers with exclusive mutation."
