# 2026-09-16: RP2040 TX-idle uses existing UART register accessors;
# their unsafe PAC sites moved without adding raw access or ownership.

# 2026-09-16: local PL011 quiescence reuses the existing exclusive MMIO
# owner and counter access. No new unsafe site; bounded passes disable TX,
# wait the current character plus clock quantum, flush/drain old state and
# observe quiet. Startup cannot turn local readiness into session authority.

# 2026-09-16: bounded power/startup and runtime entry move existing SPI PAC
# writes into the same register seam. Shared RESETS accesses modify distinct
# UART0/SPI0 bits sequentially on the sole main context, with no IRQ/core writer.
# Failed reset leaves SPI in reset; disable/enabled guard peripheral access.
# No new unsafe syntax or raw pointer; mapped-flash and PAC obligations persist.

# 2026-09-16: configuration streaming reuses existing PAC blocks and HAL pin
# ownership. GPIO input observation and Hi-Z use safe HAL methods with pulls
# disabled; no new unsafe site. Existing sites move during byte-loop reuse.

# 2026-09-16: one checked immutable mapped-flash slice binds the R0.4 image
# to the reserved upper 2 MiB before SHA-256. Firmware never writes flash or
# disables XIP, and no concurrent programmer/core/DMA may mutate that storage.
# No view is created with the default missing validated artifact.

# 2026-09-16: SPI0 adds two reviewed exclusive PAC write blocks (mode/divisor
# and byte TX), and removes the raw TIMER pointer in favor of the existing
# serialized clock owner. Bounded FIFO/time/CS host models cover the algorithm;
# target checks cover PAC/pin types. Physical timing remains unqualified.

# 2026-09-15: bounded retained-artifact queries reuse existing locks and user
# copies. No new unsafe syntax, kinds or obligations; the worker and minilib
# source locations move. All 718 sites remain classified.

# 2026-09-15: cycle/stop producers reuse the recorder owner and physical clock.
# No new unsafe syntax or obligations; existing actuation/timer source moves.
# 718 sites remain classified. Actual interpreter fixture Miri passes with its
# existing integer-to-pointer warning; this is not strict-provenance evidence.

# 2026-09-15: recorder ABI/owner/export add no unsafe syntax. Existing module,
# timer and minilib source locations move; all 718 classified sites retain
# their kinds and obligations. The recorder reuses bounded user-copy helpers.

# 2026-09-15: managed installer adds the debug UART's existing RSRECR offset
# accessor under the existing MMIO obligation. Volatile 32-bit access uses the
# same mapped base and serialized UART owner. The actual register harness checks
# sticky/empty-FIFO RX faults; physical timing remains unqualified.

# 2026-09-15: UART0 adapter adds nine reviewed PAC writes under exclusive
# ownership (error clear, byte TX, IRQ/DMA/UART disable, baud/format and IRQ clear).
# Existing sites only move. Host register algorithms, RX fault simulations and
# thumbv6m/Pi checks pass; physical reset/drain/timing remain unqualified.

# 2026-09-15: inactive retirement reuses the worker batch and stop mailbox.
# Only the existing worker scheduler site moved; normalized file/kind/obligation
# entries remain identical (708 sites). No new unsafe syntax or obligation.

# 2026-09-15: cleanup-counter preflight moves the worker source by five lines;
# all 708 site/file/kind/obligation entries remain identical after normalization.

# 2026-09-15: deactivation reuses the acknowledged slot boundary and worker
# retirement. Reviewed line relocation only: 708 sites, unchanged kinds and
# obligations. Host churn/cancellation, focused safe-ack Miri and Pi5 compile
# checks pass; physical output and timing qualification remain open.

# 2026-09-15: bounded lifecycle administration and failure receipts move existing
# source sites without changing unsafe syntax, counts, kinds or obligations.
# The cancelled-transport/new-preparation regression passes focused Miri;
# embedded/cloud host suites and Pi5 compilation pass. Physical gates remain open.

# 2026-09-15: correlated handoff/MCU integration adds no unsafe syntax;
# all 708 constructs retain their kinds and obligations, with reviewed source
# relocation. Actual borrowed stateful release passes focused Miri; Pi5 target
# compiles. No hardware scheduling or sink acknowledgement is inferred.

# 2026-09-09: reviewed prerequisite delta: seven motor-pair no_mangle
# attributes (production helper and isolated test/fuzz stubs), minus one
# removed direct PWM MMIO block. Existing obligation rules cover each site.

# 2026-09-09 timing fix: unchanged unsafe constructs/counts/obligations;
# reviewed line relocations after bench logging and terminal-path edits.

# 2026-09-12: reviewed stack/helper provenance repair and prior HIL line
# relocations. The helper test now reads its eight-byte payload under Miri.
# The additional unsafe block is confined to the test-only helper stub.

# 2026-09-15: reviewed v0.5 ownership, capability and bounded-verifier edits.
# Unsafe constructs/counts/obligations are unchanged; source locations moved.

# 2026-09-15: reviewed managed reclamation and formatting line relocations.
# Unsafe constructs/counts/obligations remain unchanged at 705 classified sites.

# 2026-09-15: installation ownership adds no unsafe syntax or obligations;
# reviewed module/fixture line movement preserves all 705 classified sites.

# Rules are evaluated in order. Keep narrow, high-risk obligations before broad
# subsystem rules. The first matching rule supplies every site-level field.

# 2026-09-15: managed invocation adds two map-helper call blocks. Exact
# verifier-proven input extents and live matching binding leases are required;
# stack pointers are reconstructed from the live borrow. Managed dispatch is
# not yet connected to the kernel. Focused managed Miri13 passes.

# 2026-09-15: the managed allocation accounting test owns its synthetic heap
# backing and validates the pinned allocator normalization and Box/Arc layouts.
# The four added unsafe constructs remain confined to this test fixture.

# 2026-09-15: the global heap wrapper adds IRQ-masked GlobalAlloc delegation;
# shared AArch64 IRQ blocks moved to the context helper without changing their
# architecture contract. Host nesting and both target builds are reviewed.

[[obligation]]
id = "TEST-HARNESS"
paths = ["*/tests/*", "*/benches/*", "*/fuzz/fuzz_targets/*"]
scope = "test/tooling"
owner = "owning crate maintainers"
invariant = "Synthetic pointers, ABI shims, and reset hooks remain confined to process-isolated test or fuzz binaries."
callers = "cargo test, cargo bench, cargo fuzz"
tests = "The containing harness is the evidence; production linkage must remain impossible."
priority = "P3"
reviewed = "2026-07-12"

