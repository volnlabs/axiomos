[package]
name = "axiomos"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0 OR MPL-2.0"

default-run = "axiomos"

[build-dependencies]
ovmf-prebuilt = "=0.2.4"
file_structure = { path = "userspace/core/file_structure" }

# x86_64 dependencies
init_x86 = { package = "init", path = "userspace/core/init", artifact = "bin", target = "x86_64-unknown-none", optional = true }
gpio_demo_x86 = { package = "gpio_demo", path = "userspace/demos/gpio_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
pwm_demo_x86 = { package = "pwm_demo", path = "userspace/demos/pwm_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
timeseries_demo_x86 = { package = "timeseries_demo", path = "userspace/demos/timeseries_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
iio_demo_x86 = { package = "iio_demo", path = "userspace/demos/iio_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
syscall_demo_x86 = { package = "syscall_demo", path = "userspace/demos/syscall_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
sys_exit_demo_x86 = { package = "sys_exit_demo", path = "userspace/demos/sys_exit_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
sched_switch_demo_x86 = { package = "sched_switch_demo", path = "userspace/demos/sched_switch_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
sched_switch_export_demo_x86 = { package = "sched_switch_export_demo", path = "userspace/demos/sched_switch_export_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
sched_switch_bridge_demo_x86 = { package = "sched_switch_bridge_demo", path = "userspace/demos/sched_switch_bridge_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
file_io_demo_x86 = { package = "file_io_demo", path = "userspace/demos/file_io_demo", artifact = "bin", target = "x86_64-unknown-none", optional = true }
fork_test_x86 = { package = "fork_test", path = "userspace/demos/fork_test", artifact = "bin", target = "x86_64-unknown-none", optional = true }
bpf_loader_x86 = { package = "bpf_loader", path = "userspace/tools/bpf_loader", artifact = "bin", target = "x86_64-unknown-none", optional = true }
signed_bpf_loader_x86 = { package = "signed_bpf_loader", path = "userspace/tools/signed_bpf_loader", artifact = "bin", target = "x86_64-unknown-none", optional = true }
benchmark_x86 = { package = "benchmark", path = "userspace/benchmarks/system", artifact = "bin", target = "x86_64-unknown-none", optional = true }
rk_uart_forwarder_x86 = { package = "rk_uart_forwarder", path = "userspace/tools/rk_uart_forwarder", artifact = "bin", target = "x86_64-unknown-none", optional = true }
verifier_bench_x86 = { package = "verifier_bench", path = "userspace/benchmarks/verifier", artifact = "bin", target = "x86_64-unknown-none", optional = true }
kernel_x86 = { package = "kernel", path = "kernel", artifact = "bin", target = "x86_64-unknown-none", optional = true, features = ["cloud-profile"] }

# aarch64 dependencies
init_aarch64 = { package = "init", path = "userspace/core/init", artifact = "bin", target = "aarch64-unknown-none", optional = true }
gpio_demo_aarch64 = { package = "gpio_demo", path = "userspace/demos/gpio_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
pwm_demo_aarch64 = { package = "pwm_demo", path = "userspace/demos/pwm_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
timeseries_demo_aarch64 = { package = "timeseries_demo", path = "userspace/demos/timeseries_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
iio_demo_aarch64 = { package = "iio_demo", path = "userspace/demos/iio_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
syscall_demo_aarch64 = { package = "syscall_demo", path = "userspace/demos/syscall_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
sys_exit_demo_aarch64 = { package = "sys_exit_demo", path = "userspace/demos/sys_exit_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
sched_switch_demo_aarch64 = { package = "sched_switch_demo", path = "userspace/demos/sched_switch_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
sched_switch_export_demo_aarch64 = { package = "sched_switch_export_demo", path = "userspace/demos/sched_switch_export_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
sched_switch_bridge_demo_aarch64 = { package = "sched_switch_bridge_demo", path = "userspace/demos/sched_switch_bridge_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
file_io_demo_aarch64 = { package = "file_io_demo", path = "userspace/demos/file_io_demo", artifact = "bin", target = "aarch64-unknown-none", optional = true }
fork_test_aarch64 = { package = "fork_test", path = "userspace/demos/fork_test", artifact = "bin", target = "aarch64-unknown-none", optional = true }
bpf_loader_aarch64 = { package = "bpf_loader", path = "userspace/tools/bpf_loader", artifact = "bin", target = "aarch64-unknown-none", optional = true }
signed_bpf_loader_aarch64 = { package = "signed_bpf_loader", path = "userspace/tools/signed_bpf_loader", artifact = "bin", target = "aarch64-unknown-none", optional = true }
benchmark_aarch64 = { package = "benchmark", path = "userspace/benchmarks/system", artifact = "bin", target = "aarch64-unknown-none", optional = true }
rk_uart_forwarder_aarch64 = { package = "rk_uart_forwarder", path = "userspace/tools/rk_uart_forwarder", artifact = "bin", target = "aarch64-unknown-none", optional = true }
verifier_bench_aarch64 = { package = "verifier_bench", path = "userspace/benchmarks/verifier", artifact = "bin", target = "aarch64-unknown-none", optional = true }
kernel_aarch64 = { package = "kernel", path = "kernel", artifact = "bin", target = "aarch64-unknown-none", optional = true, features = ["cloud-profile"] }

[features]
default = ["x86_64_deps"]
# Compile only the host runner and its unit tests. The build script rejects
# this feature outside debug profile or alongside target artifact features.
host-runner-tests = []
bpf-unsigned-development = [
  "kernel_x86/bpf-unsigned-development",
  "init_x86/bpf-unsigned-development",
]
bpf-unsigned-development-aarch64 = [
  "kernel_aarch64/bpf-unsigned-development",
  "init_aarch64/bpf-unsigned-development",
]
audit-diagnostics = ["kernel_x86/audit-diagnostics"]
audit-diagnostics-aarch64 = ["kernel_aarch64/audit-diagnostics"]
audit-fault-injection = ["kernel_x86/audit-fault-injection"]
bpf-update-probe = ["kernel_x86/bpf-update-diagnostics", "bpf-unsigned-development"]
bringup-diagnostics = ["kernel_aarch64/bringup-diagnostics"]



x86_64_deps = [
  "dep:init_x86",
  "dep:gpio_demo_x86",
  "dep:pwm_demo_x86",
  "dep:timeseries_demo_x86",
  "dep:iio_demo_x86",
  "dep:syscall_demo_x86",
  "dep:sys_exit_demo_x86",
  "dep:sched_switch_demo_x86",
  "dep:sched_switch_export_demo_x86",
  "dep:sched_switch_bridge_demo_x86",
  "dep:file_io_demo_x86",
  "dep:fork_test_x86",
  "dep:bpf_loader_x86",
  "dep:signed_bpf_loader_x86",
  "dep:benchmark_x86",
  "dep:rk_uart_forwarder_x86",
  "dep:verifier_bench_x86",
  "dep:kernel_x86",
]
aarch64_deps = [
  "dep:init_aarch64",
  "dep:gpio_demo_aarch64",
  "dep:pwm_demo_aarch64",
  "dep:timeseries_demo_aarch64",
  "dep:iio_demo_aarch64",
  "dep:syscall_demo_aarch64",
  "dep:sys_exit_demo_aarch64",
  "dep:sched_switch_demo_aarch64",
  "dep:sched_switch_export_demo_aarch64",
  "dep:sched_switch_bridge_demo_aarch64",
  "dep:file_io_demo_aarch64",
  "dep:fork_test_aarch64",
  "dep:bpf_loader_aarch64",
  "dep:signed_bpf_loader_aarch64",
  "dep:benchmark_aarch64",
  "dep:rk_uart_forwarder_aarch64",
  "dep:verifier_bench_aarch64",
  "dep:kernel_aarch64",
]

[workspace]
exclude = [
  "kernel/demos/riscv",
  "userspace/tools/rk_bridge",
  "kernel/crates/kernel_bpf/fuzz",
  "firmware/shrike/rp2040",
]
members = [
  "tools/xtask",
  "kernel",
  "kernel/crates/kernel_abi",
  "kernel/crates/kernel_bpf",
  "kernel/crates/kernel_devfs",
  "kernel/crates/kernel_device",
  "kernel/crates/kernel_elfloader",
  "kernel/crates/kernel_memapi",
  "kernel/crates/kernel_pci",
  "kernel/crates/kernel_physical_memory",
  "kernel/crates/kernel_run_queue",
  "kernel/crates/kernel_syscall",
  "kernel/crates/kernel_time",
  "kernel/crates/kernel_vfs",
  "kernel/crates/kernel_map_transaction",
  "kernel/crates/kernel_virtual_memory",
  "kernel/crates/kernel_usermem",
  "kernel/crates/shrike_link",
  "firmware/shrike/control",
  "firmware/shrike/simulation",
  "userspace/tools/bpf_loader",
  "userspace/tools/signed_bpf_loader",
  "userspace/core/file_structure",
  "userspace/core/init",
  "userspace/core/minilib",
  "userspace/demos/gpio_demo",
  "userspace/demos/pwm_demo",
  "userspace/demos/timeseries_demo",
  "userspace/demos/iio_demo",
  "userspace/demos/syscall_demo",
  "userspace/demos/sys_exit_demo",
  "userspace/demos/sched_switch_demo",
  "userspace/demos/sched_switch_export_demo",
  "userspace/demos/sched_switch_bridge_demo",
  "userspace/demos/file_io_demo",
  "userspace/demos/safety_demo",
  "userspace/demos/fork_test",
  "userspace/benchmarks/system",
  "userspace/tools/rk_uart_forwarder",
  "userspace/benchmarks/verifier",
]
default-members = [
  ".",
  "kernel/crates/kernel_abi",
  "kernel/crates/kernel_devfs",
  "kernel/crates/kernel_device",
  "kernel/crates/kernel_elfloader",
  "kernel/crates/kernel_memapi",
  "kernel/crates/kernel_pci",
  "kernel/crates/kernel_physical_memory",
  "kernel/crates/kernel_run_queue",
  "kernel/crates/kernel_syscall",
  "kernel/crates/kernel_time",
  "kernel/crates/kernel_vfs",
  "kernel/crates/kernel_map_transaction",
  "kernel/crates/kernel_virtual_memory",
  "userspace/core/file_structure",
]

[dependencies]

[target.'cfg(not(target_os = "none"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }

[workspace.dependencies]
acpi = "5.2"
addr2line = { version = "0.26", default-features = false, features = [
  "fallible-iterator",
  "rustc-demangle",
] }
bitfield = "0.19"
bitflags = "2.10"
conquer-once = { version = "0.4", default-features = false }
cordyceps = { version = "0.3", default-features = false, features = ["alloc"] }
raw-cpuid = "11"
either = { version = "1.15", default-features = false }
elf = { version = "0.7", default-features = false, features = ["nightly"] }
itertools = { version = "0.14.0", default-features = false, features = [
  "use_alloc",
] }
jiff = { version = "0.2", default-features = false, features = ["alloc"] }
limine = "0.5"
linked_list_allocator = "0.10"
linkme = "0.3"
log = { version = "0.4", features = ["release_max_level_off"] }
mkfs-ext2 = { git = "https://github.com/tsatke/mkfs" }
mkfs-filesystem = { git = "https://github.com/tsatke/mkfs" }
rustc-demangle = "0.1"
sha3 = { version = "0.11.0-rc.3", default-features = false }
spin = "0.10"
thiserror = { version = "2.0", default-features = false }
uart_16550 = "0.4"
virtio-drivers = "0.12"
volatile = { version = "0.6", features = ["derive"] }
x2apic = "0.5"
x86_64 = "0.15"
aarch64-cpu = "9.4"
zerocopy = { version = "0.9.0-alpha.0", default-features = false, features = ["derive"] }
fdt = "0.1.5"

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
