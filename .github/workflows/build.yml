name: Rust

# H-06 / PR #1 fixes in this workflow:
#   * Toolchain pinning: every job installs nightly-2026-07-02 through
#     dtolnay/rust-toolchain@master, the same channel declared in
#     rust-toolchain.toml. The previous "nightly"
#     and "stable" pins floated; stable in particular could not parse the
#     workspace's `artifact = "bin"` (requires nightly -Z bindeps).
#   * Standalone-workspace coverage: every Cargo workspace not in the root
#     default-members gets an explicit lint + test job
#     (`lint-standalone-workspaces`, `test-standalone-workspaces`).
#   * QEMU kernel-test protocol: a new `qemu-kernel-smoke` job builds the
#     release ISO, boots it under `qemu-system-x86_64` with a hard timeout, and
#     asserts a serial-line PASS marker before declaring success. The kernel
#     emits `QEMU_BOOT_OK` once user-mode init has mounted the ext2 rootfs and
#     reached the BPF manager idle state.

permissions:
  contents: read

on:
  # Skip full CI on doc-only changes — they used to fire the whole fan-out.
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly drift check (Mon 05:00 UTC). Was twice-daily; at ~145 billed
    # minutes/run that alone approached the whole monthly quota.
    - cron: 0 5 * * 1

# Cancel an in-progress run when a newer commit lands on the same ref. During
# rapid iteration this is the single biggest saver — a superseded fan-out run
# (lint + tests + per-crate Miri + build, every job billed) is killed at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN_DATE: '2026-07-02'

jobs:

  aarch64-exception-context:
    name: "AArch64 exception register canaries"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install emulator and cross assembler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-system-arm
      - name: Execute production exception vectors
        run: python3 -B scripts/verify/aarch64-exception-context.py

  lint:
    name: "Lint (root workspace)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy, llvm-tools-preview, rust-src
      - name: Add build target
        run: |
          rustup target add x86_64-unknown-none
          rustup target add aarch64-unknown-none
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y xorriso
      - name: Rustfmt
        run: |
          cargo fmt --all -- --check
      - name: Unsafe-code ledger
        run: python3 -B scripts/verify/unsafe-ledger.py --check
      - name: Component inventory and generated documentation
        run: |
          cargo xtask inventory --check
          cargo xtask docs --check
      - name: Clippy (per-crate, matches local CI recipe)
        # Per the kernel build guidance: per-crate clippy avoids the
        # profile-typed kernel_bpf "no default profile" failures that bare
        # `cargo clippy --workspace --lib` triggers on a host build.
        run: |
          cargo clippy -p kernel_abi --lib -- -D clippy::all
          cargo clippy -p kernel_elfloader --all-targets -- -D clippy::all
          cargo clippy -p kernel_syscall --all-targets -- -D clippy::all
          cargo clippy -p kernel_time --all-targets -- -D clippy::all
          cargo clippy -p kernel_usermem --all-targets -- -D clippy::all
          cargo clippy -p kernel_virtual_memory --all-targets -- -D clippy::all
          cargo clippy -p kernel_vfs --lib -- -D clippy::all
          cargo clippy -p kernel_physical_memory --lib -- -D clippy::all
          cargo clippy -p xtask --all-targets -- -D clippy::all
          cargo clippy -p kernel_bpf --no-default-features --features cloud-profile --lib -- -D clippy::all
          cargo clippy -p kernel_bpf --no-default-features --features embedded-profile --lib -- -D clippy::all

  lint-standalone-workspaces:
    name: "Lint (standalone workspaces)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Add standalone non-host targets
        run: |
          sudo apt update
          sudo apt install -y gcc-riscv64-unknown-elf
          rustup target add thumbv6m-none-eabi
          rustup target add riscv64gc-unknown-none-elf
      - name: Clippy (rk_bridge)
        run: cargo clippy --manifest-path userspace/tools/rk_bridge/Cargo.toml --lib -- -D clippy::all
      - name: Clippy (rk_cli)
        run: cargo clippy --manifest-path userspace/tools/rk_cli/Cargo.toml -- -D clippy::all
      - name: Clippy (RP2040 firmware, debug)
        run: cargo clippy --manifest-path firmware/shrike/rp2040/Cargo.toml --target thumbv6m-none-eabi -- -D clippy::all
      - name: Clippy (RP2040 firmware, release)
        run: cargo clippy --manifest-path firmware/shrike/rp2040/Cargo.toml --target thumbv6m-none-eabi --release -- -D clippy::all
      - name: Clippy (RISC-V demo)
        # Audit fix R5: `--manifest-path` from the repository root does not
        # load kernel/demos/riscv/.cargo/config.toml, so the previous command
        # compiled the demo build script for the host target and invoked host
        # `cc` with RISC-V flags. Pass the target explicitly.
        run: cargo clippy --manifest-path kernel/demos/riscv/Cargo.toml --target riscv64gc-unknown-none-elf -- -D clippy::all
      - name: Clippy (Lean check, formal proofs)
        working-directory: formal
        run: |
          # Audit fix R1: install elan instead of silently skipping the
          # Lean check. The previous step's "skip if not installed" path
          # meant a CI run could pass without exercising the formal/
          # workspace at all.
          if ! command -v elan >/dev/null 2>&1; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          fi
          # GITHUB_PATH is applied only to later steps; export PATH here too
          # so a fresh runner can invoke `lake` in this same shell.
          export PATH="$HOME/.elan/bin:$PATH"
          lake build

  fpga-safety-gate:
    name: "FPGA safety gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt update
          sudo apt install -y iverilog
      - name: Simulate FPGA safety gate and R0.4 runtime link
        run: scripts/verify/fpga-safety-gate.sh

  test:
      name: "Test (root workspace)"
      runs-on: ubuntu-latest
      strategy:
        matrix:
          strategy: [ debug, release ]
      steps:
        - uses: actions/checkout@v4
        - name: Install pinned nightly
          uses: dtolnay/rust-toolchain@master
          with:
            toolchain: nightly-2026-07-02
        - name: Install dependencies
          run: |
            sudo apt update
            sudo apt install -y xorriso
        - name: Test (per-crate, host-testable)
          # Audit fix R1: matrix now includes kernel_usermem (PR #2.1) and
          # kernel_elfloader (PR #10) plus its audit-h05 regression suite.
          run: |
            PROFILE_FLAG=""
            if [[ "${{ matrix.strategy }}" == "release" ]]; then PROFILE_FLAG="--release"; fi
            set -e
            cargo test -p kernel_abi $PROFILE_FLAG
            cargo test -p kernel_vfs $PROFILE_FLAG
            cargo test -p kernel_physical_memory $PROFILE_FLAG
            cargo test -p kernel_syscall $PROFILE_FLAG
            cargo test -p kernel_time $PROFILE_FLAG
            cargo test -p kernel_virtual_memory $PROFILE_FLAG
            cargo test -p kernel_usermem $PROFILE_FLAG
            cargo test --manifest-path kernel/crates/kernel_elfloader/Cargo.toml $PROFILE_FLAG
            cargo test --manifest-path kernel/crates/kernel_elfloader/Cargo.toml --test audit_h05_malformed $PROFILE_FLAG
            cargo test -p kernel_bpf --no-default-features --features cloud-profile $PROFILE_FLAG
            cargo test -p kernel_bpf --no-default-features --features cloud-profile --test profile_contracts $PROFILE_FLAG
            cargo test -p kernel_bpf --no-default-features --features embedded-profile $PROFILE_FLAG
            EMBEDDED_DISK_PATH=/dev/null cargo test --locked -p kernel --lib --features embedded-profile pwm_observation_attach_is_rejected_without_publication $PROFILE_FLAG
            cargo test -p shrike_link $PROFILE_FLAG
            cargo test -p shrike_control $PROFILE_FLAG
            cargo test -p shrike_rp2040_host_sim $PROFILE_FLAG
  test-standalone-workspaces:
    name: "Test (standalone workspaces)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          targets: thumbv6m-none-eabi
      - name: Add RP2040 target
        run: rustup target add thumbv6m-none-eabi
      - name: Test rk_bridge
        run: cargo test --manifest-path userspace/tools/rk_bridge/Cargo.toml
      - name: Test rk_cli
        run: cargo test --manifest-path userspace/tools/rk_cli/Cargo.toml
      - name: Test Shrike-lite R0.4 board profile
        run: |
          rustc --edition=2021 --test firmware/shrike/rp2040/host-tests/r04_board_profile.rs -o /tmp/r04-board-profile-test
          /tmp/r04-board-profile-test
      - name: Test Shrike-lite R0.4 flash contract
        run: python3 firmware/shrike/rp2040/host-tests/test_flash_contract.py
      - name: Test RP2040 firmware (debug)
        run: cargo test --manifest-path firmware/shrike/rp2040/Cargo.toml --target thumbv6m-none-eabi --no-run
      - name: Test RP2040 firmware (release)
        run: cargo test --manifest-path firmware/shrike/rp2040/Cargo.toml --target thumbv6m-none-eabi --release --no-run
      - name: Build and verify Shrike-lite R0.4 UF2
        run: |
          firmware/shrike/rp2040/build-uf2.sh
          sha256sum --check firmware/shrike/rp2040/target/thumbv6m-none-eabi/release/shrike_rp2040.uf2.sha256

  firmware-rp2040:
    name: "Firmware (RP2040)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          targets: thumbv6m-none-eabi
      - name: Check RP2040 firmware (debug)
        run: |
          cargo check --manifest-path firmware/shrike/rp2040/Cargo.toml --target thumbv6m-none-eabi
      - name: Check RP2040 firmware (release)
        run: |
          cargo check --manifest-path firmware/shrike/rp2040/Cargo.toml --target thumbv6m-none-eabi --release

  prepare-miri:
    name: "Prepare Miri"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          # Exclude kernel_bpf - it has its own job with profile matrix.
          # Some kernel/crates directories are non-Cargo fixtures, so build
          # the matrix from manifests rather than directory names.
          export PACKAGES="$(find kernel/crates -mindepth 2 -maxdepth 2 -name Cargo.toml -exec awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { in_package = 0 }
            in_package && /^name[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*"/, "")
              sub(/".*/, "")
              print
              exit
            }
          ' {} \; \
            | sort -u \
            | grep -vx 'kernel_bpf' \
            | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "matrix={\"package\":${PACKAGES}}" >> $GITHUB_OUTPUT

  miri:
    name: "Miri"
    runs-on: ubuntu-latest
    needs: prepare-miri
    strategy:
      matrix: ${{fromJson(needs.prepare-miri.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          components: miri, rust-src
      - name: Miri Setup
        run: |
          cargo miri setup
      - name: Miri
        run: |
          cargo miri test -p ${{ matrix.package }}

  miri-kernel-bpf:
    name: "Miri (kernel_bpf)"
    runs-on: ubuntu-latest
    # Cap runtime so a hung Miri can't bill unbounded (up to GitHub's 6h max).
    # The embedded-profile matrix entry hung for 90+ min on 2026-07-04 while
    # cloud-profile finished in ~14 min — see the tracking issue. Miri's UB
    # detection is profile-agnostic (only const sizes differ between profiles),
    # so cloud-profile alone covers the unsafe surface; embedded is dropped
    # until the hang is understood.
    timeout-minutes: 30
    strategy:
      matrix:
        profile: [cloud-profile]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          components: miri, rust-src
      - name: Miri Setup
        run: |
          cargo miri setup
      - name: Miri
        run: |
          cargo miri test -p kernel_bpf --no-default-features --features ${{ matrix.profile }}


  build:
    name: "Build and upload artifacts"
    runs-on: ubuntu-latest
    needs:
      - test
      - test-standalone-workspaces
      - firmware-rp2040
      - miri
      - miri-kernel-bpf
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          targets: x86_64-unknown-none, aarch64-unknown-none
      - name: Add build targets
        run: |
          rustup target add x86_64-unknown-none
          rustup target add aarch64-unknown-none
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y xorriso e2fsprogs gcc-aarch64-linux-gnu
      - name: Install CI BPF trust fixture
        run: |
          # This RFC 8032 public key is a reproducible CI fixture, not a secret
          # or a production trust root. Keeping it in the job makes fork PR
          # builds work without weakening signed-only production builds.
          TRUSTED_KEY_FIXTURE="$RUNNER_TEMP/axiomos-bpf-ci-trusted-key.bin"
          printf '\xd7\x5a\x98\x01\x82\xb1\x0a\xb7\xd5\x4b\xfe\xd3\xc9\x64\x07\x3a\x0e\xe1\x72\xf3\xda\xa6\x23\x25\xaf\x02\x1a\x68\xf7\x07\x51\x1a' > "$TRUSTED_KEY_FIXTURE"
          echo "AXIOM_BPF_TRUSTED_KEY_PATH=$TRUSTED_KEY_FIXTURE" >> "$GITHUB_ENV"
      - name: Build (x86_64)
        run: |
          cargo build --release
      - name: Verify rootfs selection and clean fallback
        run: python3 -B scripts/verify/rootfs-selection.py
      - name: Build (AArch64)
        run: |
          cargo build --release --target aarch64-unknown-none --no-default-features --features aarch64_deps
      - uses: actions/upload-artifact@v4
        with:
          name: axiomos-boot-images
          path: |
            target/release/build/**/out/axiomos.iso

  qemu-kernel-smoke:
      name: "QEMU kernel smoke (x86_64)"
      # T-01 / H-06: a deterministic serial-line smoke test that boots the
      # release ISO under QEMU and asserts the kernel reaches init (rootfs
      # mounted, ext2 mounted, init started) — *not* just kernel init. The
      # marker `QEMU_BOOT_OK` is emitted from kernel/src/main.rs right after
      # Process::create_userspace_init returns for /bin/init (R1 moved it
      # out of print_benchmark_metrics); init creation is observed via the
      # explicit `INIT_PROCESS_STARTED` audit marker at the same point.
      # Boot must complete ACPI/RSDP walk
      # before either marker — a kernel panic during ACPI is treated as a
      # gate failure (audit review round-1 finding).
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
        - uses: actions/checkout@v4
        - name: Install pinned nightly
          uses: dtolnay/rust-toolchain@master
          with:
            toolchain: nightly-2026-07-02
            targets: x86_64-unknown-none
        - name: Add build target
          run: rustup target add x86_64-unknown-none
        - name: Install QEMU + ISO/disk build deps
          run: |
            sudo apt update
            # The project build fetches pinned UEFI firmware into target/ovmf;
            # this job only needs QEMU and image-construction dependencies.
            sudo apt install -y qemu-system-x86 xorriso mtools e2fsprogs
        - name: Build release (produces axiomos.iso + disk image)
          env:
            AXIOMOS_BOOT_TIMEOUT_SECS: "60"
          run: |
            TRUSTED_KEY_FIXTURE="$(mktemp)"
            ARTIFACT_PATHS="$RUNNER_TEMP/build-artifacts.env"
            trap 'rm -f "$TRUSTED_KEY_FIXTURE"' EXIT
            printf '\xd7\x5a\x98\x01\x82\xb1\x0a\xb7\xd5\x4b\xfe\xd3\xc9\x64\x07\x3a\x0e\xe1\x72\xf3\xda\xa6\x23\x25\xaf\x02\x1a\x68\xf7\x07\x51\x1a' > "$TRUSTED_KEY_FIXTURE"
            ARTIFACT_ENV_PREFIX=AXIOM
            export "${ARTIFACT_ENV_PREFIX}_ARTIFACT_PATHS=$ARTIFACT_PATHS"
            AXIOM_BPF_TRUSTED_KEY_PATH="$TRUSTED_KEY_FIXTURE" cargo build --release --features audit-diagnostics
        - name: Load build artifacts
          id: artifacts
          run: |
            set -e
            ARTIFACT_PATHS="$RUNNER_TEMP/build-artifacts.env"
            if [[ ! -s "$ARTIFACT_PATHS" ]]; then
              echo "::error::release build did not emit its artifact manifest"
              exit 1
            fi
            source "$ARTIFACT_PATHS"
            for path in "$BOOTABLE_ISO" "$DISK_IMAGE" "$OVMF_CODE" "$OVMF_VARS"; do
              if [[ ! -r "$path" ]]; then
                echo "::error::build artifact is missing or unreadable: $path"
                exit 1
              fi
            done
            echo "iso-path=$BOOTABLE_ISO" >> "$GITHUB_OUTPUT"
            echo "disk-path=$DISK_IMAGE" >> "$GITHUB_OUTPUT"
            echo "ovmf-code=$OVMF_CODE" >> "$GITHUB_OUTPUT"
            echo "ovmf-vars=$OVMF_VARS" >> "$GITHUB_OUTPUT"
        - name: Boot ISO under QEMU (OVMF + disk)
          env:
            ISO_PATH: ${{ steps.artifacts.outputs.iso-path }}
            DISK_PATH: ${{ steps.artifacts.outputs.disk-path }}
            OVMF_CODE: ${{ steps.artifacts.outputs.ovmf-code }}
            OVMF_VARS: ${{ steps.artifacts.outputs.ovmf-vars }}
          run: |
            set -e
            SERIAL_LOG=$(mktemp)
            OVMF_VARS_COPY=$(mktemp)
            trap 'rm -f "$SERIAL_LOG" "$OVMF_VARS_COPY"' EXIT
            cp "$OVMF_VARS" "$OVMF_VARS_COPY"
            chmod u+w "$OVMF_VARS_COPY"
            # Mirror src/main.rs QEMU arguments: OVMF pflash, virtio-blk disk,
            # cdrom ISO, 1 GiB RAM, 2 vCPUs (matches the audit's reproducing run).
            # -no-reboot: panic/halt exits QEMU cleanly rather than spinning.
            # -monitor none / -display none: headless serial-only output.
            # -nographic keeps a graphics device attached (matches the runner).
            timeout 90s qemu-system-x86_64 \
              -drive "if=pflash,unit=0,format=raw,file=$OVMF_CODE,readonly=on" \
              -drive "if=pflash,unit=1,format=raw,file=$OVMF_VARS_COPY" \
              -cdrom "$ISO_PATH" \
              -drive "id=virtio-disk0,file=$DISK_PATH,format=raw,if=none" \
              -device virtio-blk-pci,drive=virtio-disk0 \
              -m 1G -smp 2 \
              -cpu max \
              -vga none \
              -display none -monitor none \
              -serial file:"$SERIAL_LOG" \
              -no-reboot || true
            echo "----- serial capture (last 200 lines) -----"
            tail -n 200 "$SERIAL_LOG" || true
            echo "----- marker check -----"
                      # Audit fix R1: marker must follow root mount + init creation.
            # The qemu-kernel-smoke gate requires ALL of:
            #   1. QEMU_BOOT_OK printed after "INIT_PROCESS_STARTED pid=1"
            #      (i.e. after the root mount and init creation in
            #      src/main.rs, not from kernel::init)
            #   2. no RsdpIncorrectSignature / acpi.rs:28 panic before
            #      init (the audit's known boot-time failure mode)
            #   3. at least one userspace process actually ran — evidence
            #      that init reached user mode without dying immediately
            #
            #   4. /bin/init receives EFAULT, without a CPU page fault, for
            #      copy-in and copy-out syscalls aimed at an unmapped canonical
            #      user address
            #   5. unknown syscalls return ENOSYS instead of panicking
            ACPI_FAIL=$(grep -c -E 'RsdpIncorrectSignature|RSDP|panicked at kernel/src/acpi' "$SERIAL_LOG" || true)
            BOOT_OK=$(grep -c 'QEMU_BOOT_OK' "$SERIAL_LOG" || true)
            INIT_RAN=$(grep -c 'INIT_PROCESS_STARTED pid=' "$SERIAL_LOG" || true)
            USERCOPY_OK=$(grep -c 'USERCOPY_EFAULT_OK' "$SERIAL_LOG" || true)
            ENOSYS_OK=$(grep -c 'UNKNOWN_SYSCALL_ENOSYS_OK' "$SERIAL_LOG" || true)
            EXCEPTION_PANIC=$(grep -c -E 'panicked at kernel/src/arch/idt|KERNEL_MODE.*PAGE FAULT' "$SERIAL_LOG" || true)

            if [[ "$ACPI_FAIL" -gt 0 ]]; then
              echo "::error::ACPI/RSDP failure before QEMU_BOOT_OK — kernel panicked during boot"
              echo "Audit round-1 finding: kernel/src/acpi.rs:28 panics on RSDP mismatch."
              exit 1
            fi
            if [[ "$BOOT_OK" -lt 1 ]]; then
              echo "::error::QEMU_BOOT_OK marker missing from serial capture"
              exit 1
            fi
            if [[ "$INIT_RAN" -lt 1 ]]; then
              echo "::error::INIT_PROCESS_STARTED missing — kernel reached QEMU_BOOT_OK but init was not created"
              exit 1
            fi
            if [[ "$USERCOPY_OK" -lt 1 ]]; then
              echo "::error::USERCOPY_EFAULT_OK missing — unmapped user pointers were not contained as EFAULT"
              exit 1
            fi
            if [[ "$ENOSYS_OK" -lt 1 ]]; then
              echo "::error::UNKNOWN_SYSCALL_ENOSYS_OK missing — unknown syscall contract regressed"
              exit 1
            fi
            if [[ "$EXCEPTION_PANIC" -gt 0 ]]; then
              echo "::error::kernel exception path panicked during userspace smoke test"
              exit 1
            fi
            echo "PASS: kernel reached init; user-copy EFAULT and ENOSYS containment probes passed"
