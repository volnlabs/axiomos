[unstable]
# enable the unstable artifact-dependencies feature, see
# https://doc.rust-lang.org/nightly/cargo/reference/unstable.html#artifact-dependencies
bindeps = true

[target.x86_64-unknown-none]
rustflags = [
    # curve25519-dalek defaults to nightly SIMD on x86_64. The pinned compiler
    # crashes while codegenning that backend for `target_os = "none"`.
    "--cfg", "curve25519_dalek_backend=\"serial\"",
    "-C", "link-arg=-z",
    "-C", "link-arg=nostart-stop-gc",
    "-C", "force-frame-pointers=yes",
    "-C", "force-unwind-tables=yes",
    "-C", "relocation-model=static",
    "-g"
]

# RISC-V config removed - main kernel doesn't build for RISC-V yet
# Use kernel/demos/riscv/ which has its own .cargo/config.toml

[target.aarch64-unknown-none]
rustflags = [
    "-C", "link-arg=--image-base=0x100000000",
    "-C", "link-arg=-z",
    "-C", "link-arg=nostart-stop-gc",
    "-C", "force-frame-pointers=yes",
    "-C", "force-unwind-tables=yes",
    "-C", "relocation-model=static",
    "-g"
]
